[tool.poetry]
name = "ml-service"
version = "0.1.0"
description = "Kupil muzhik slyapu, a ona emu kak raz"
authors = ["Smirnoff Daniil", ]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10.7"
numpy = "1.26.4"
pandas = "2.0.3"
scikit-learn = "1.3.2"
matplotlib = "3.9.2"
joblib = "1.3.2"
loguru = "0.7.3"
pydantic = "2.8.2"
fastapi = "0.110.1"
uvicorn = "0.27.1"
streamlit = "1.33.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"