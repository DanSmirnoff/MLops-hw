[tool.poetry]
name = "ml-service"
version = "0.2.0"
description = "Kupil muzhik slyapu, a ona emu kak raz"
authors = ["Smirnoff Daniil", ]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10.7"
numpy = "1.26.4"
pandas = "2.0.3"
scikit-learn = "1.3.2"
matplotlib = "3.9.2"
joblib = "1.3.2"
loguru = "0.7.3"
pydantic = "2.8.2"
fastapi = "0.110.1"
uvicorn = "0.27.1"
streamlit = "1.33.0"
pydantic-settings = "^2.0.0"
boto3 = "^1.34.0"
dvc = "^3.0.0"
dvc-s3 = "^3.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line too long - handled by formatting
